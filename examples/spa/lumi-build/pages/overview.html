<template id="overview-view">
  <section id="overview" aria-labelledby="overview-title">
    <div class="heading">
      <div>
        <p class="eyebrow"></p>
        <h1 id="overview-title">Welcome, Freddy</h1>
        <p>Here's what's happening across your workspace today.</p>
      </div>
      <a class="primary-button" href="#/projects">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7.5h6l2-2h8v14H4v-12Z"></path>
        </svg>
        View projects
      </a>
    </div>

    <div class="metric-grid">
      <article class="metric-card">
        <div class="top">
          <span class="label">Metric</span>
        </div>
        <strong class="value">0</strong>
        <span class="change">No change</span>
      </article>
    </div>

    <section class="focus">
      <div class="heading">
        <div>
          <h2>In focus</h2>
          <p>Your team's most active projects.</p>
        </div>
        <a class="text-link" href="#/projects">
          View all
          <span aria-hidden="true">→</span>
        </a>
      </div>
      <div class="content"></div>
    </section>

    <div class="overview-lower">
      <section class="panel activity-panel" aria-labelledby="recent-activity-title">
        <div class="heading">
          <div>
            <h2 id="recent-activity-title">Recent activity</h2>
            <p>The latest updates from your team.</p>
          </div>
          <a class="text-link" href="#/activity">See all</a>
        </div>
        <div class="content"></div>
      </section>

      <aside class="panel week-card" aria-labelledby="week-title">
        <div class="top">
          <p class="eyebrow">This week</p>
          <h2 id="week-title">Strong momentum</h2>
          <p>Your team completed 28% more work than last week.</p>
        </div>
        <div class="week-chart" aria-label="Weekly activity chart">
          <span data-day="Mon"><i>Mon</i></span>
          <span data-day="Tue"><i>Tue</i></span>
          <span data-day="Wed"><i>Wed</i></span>
          <span data-day="Thu"><i>Thu</i></span>
          <span data-day="Fri"><i>Fri</i></span>
          <span data-day="Sat"><i>Sat</i></span>
          <span data-day="Sun"><i>Sun</i></span>
        </div>
      </aside>
    </div>
  </section>
</template>

<script type="module">
  import {
    attr,
    overviewDetails,
    repeat,
    text,
  } from '../app.js'

  const weekDays = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun']

  export default {
    present: data => ({
      ...overviewDetails(data.now),
      metrics: data.metrics,
    }),
    template: document.querySelector('#overview-view'),
    bindings: [
      text('#overview > .heading .eyebrow', ({data}) => data.date),
      text('#overview-title', ({data}) => data.title),
      ...weekDays.map(day => attr(
        `.week-chart [data-day="${day}"]`,
        'data-day-state',
        ({data}) => data.today === day ? 'today' : false,
      )),
      repeat('.metric-card', ({data}) => data.metrics, [
        text('.label', ({item}) => item.label),
        text('.value', ({item}) => item.value),
        text('.change', ({item}) => item.change),
        attr(':scope', 'data-direction', ({item}) => item.direction),
      ]),
    ],
  }
</script>
