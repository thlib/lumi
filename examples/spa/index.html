<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#17152d">
    <meta
      name="description"
      content="A single-page application composed with Lumi."
    >
    <title>Overview · Luminate</title>
    <link rel="stylesheet" href="./spa.css">
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <div id="app"></div>

    <template id="app-shell">
      <div id="shell">
        <div id="header"></div>

        <aside id="sidebar"></aside>

        <button id="backdrop" type="button" aria-label="Close navigation"></button>

        <main tabindex="-1"></main>
      </div>
    </template>

    <script type="module">
      import {
        classToggle,
        define,
        on,
        update,
      } from './app.js'

      define('appShell', {
        present: data => ({
          navOpen: data.navOpen,
        }),
        template: document.querySelector('#app-shell'),
        bindings: [
          classToggle('#shell', 'nav-open', ({data}) => data.navOpen),
          on('#backdrop', 'click', () => {
            update(data => ({...data, navOpen: false}))
          }),
        ],
      })
    </script>

    <template id="header-view">
      <header id="topbar">
        <div class="start">
          <button
            class="icon-button"
            id="menu"
            type="button"
            aria-label="Open navigation"
            aria-controls="navigation"
            aria-expanded="false"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h16M4 12h16M4 17h16"></path>
            </svg>
          </button>

          <a class="brand" href="#/overview" aria-label="Luminate overview">
            <svg class="mark" viewBox="0 0 36 36" aria-hidden="true">
              <path d="M18 3l3.6 11.4L33 18l-11.4 3.6L18 33l-3.6-11.4L3 18l11.4-3.6L18 3Z"></path>
              <circle cx="18" cy="18" r="3.8"></circle>
            </svg>
            <span>luminate</span>
          </a>

          <span class="divider" aria-hidden="true"></span>
          <div class="workspace-switcher">
            <span class="avatar">N</span>
            <span class="name">Luminate</span>
          </div>
        </div>

        <div class="end">
          <a class="user-menu" href="#/teams/freddy-fraggin">
            <span class="avatar">FF</span>
            <span class="name">Freddy Fraggin</span>
          </a>
        </div>
      </header>
    </template>

    <script type="module">
      import {attr, define, on, text, update} from './app.js'

      define('header', {
        present: data => ({
          workspace: 'Luminate',
          userName: 'Freddy Fraggin',
          userInitials: 'FF',
          navOpen: data.navOpen,
        }),
        template: document.querySelector('#header-view'),
        bindings: [
          text('.workspace-switcher .name', ({data}) => data.workspace),
          text('.user-menu .name', ({data}) => data.userName),
          text('.user-menu .avatar', ({data}) => data.userInitials),
          attr(
            '[aria-controls="navigation"]',
            'aria-expanded',
            ({data}) => String(data.navOpen),
          ),
          on('[aria-controls="navigation"]', 'click', () => {
            update(data => ({...data, navOpen: !data.navOpen}))
          }),
        ],
      })
    </script>

    <template id="navigation-view">
      <nav id="navigation" aria-label="Primary navigation">
        <div class="body">
          <p class="eyebrow">Workspace</p>
          <a class="link" href="#/overview">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="4" y="4" width="6" height="6" rx="1"></rect>
              <rect x="14" y="4" width="6" height="6" rx="1"></rect>
              <rect x="4" y="14" width="6" height="6" rx="1"></rect>
              <rect x="14" y="14" width="6" height="6" rx="1"></rect>
            </svg>
            <span>Overview</span>
          </a>
          <a class="link" href="#/projects">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7.5h6l2-2h8v14H4v-12Z"></path>
            </svg>
            <span>Projects</span>
            <span class="count">4</span>
          </a>
          <a class="link" href="#/records">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 5h14M5 12h14M5 19h14"></path>
            </svg>
            <span>Records</span>
          </a>
          <a class="link" href="#/activity">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 12h3l2-6 4 12 2-6h5"></path>
            </svg>
            <span>Activity</span>
          </a>

          <p class="eyebrow manage">Manage</p>
          <a class="link" href="#/teams">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="9" cy="8" r="3"></circle>
              <path d="M3.5 19c.5-4 2.3-6 5.5-6s5 2 5.5 6M16 8h5M18.5 5.5v5"></path>
            </svg>
            <span>Teams</span>
          </a>
        </div>

      </nav>
    </template>

    <script type="module">
      import {attr, define, on, text, update} from './app.js'

      // Each link already carries its route in href, so the bindings read the
      // document rather than a parallel attribute.
      define('navigation', {
        present: data => ({
          route: data.route,
          projectCount: data.projects.length,
        }),
        template: document.querySelector('#navigation-view'),
        bindings: [
          text('.link .count', ({data}) => data.projectCount),
          on('.link', 'click', (e, el) => {
            if (el.getAttribute('href') === window.location.hash) {
              update(data => ({...data, navOpen: false}))
            }
          }),
          attr(
            '.link',
            'aria-current',
            ({data}, el) => (
              el.getAttribute('href') === `#/${data.route}` ? 'page' : false
            ),
          ),
        ],
      })
    </script>

    <template id="teams-view">
      <section id="teams">
        <div id="directory">
          <div class="heading">
            <div>
              <p class="eyebrow">Manage</p>
              <h1 id="teams-title">Manage teams</h1>
              <p>Invite people and organize how your workspace collaborates.</p>
            </div>
            <span class="count">11 members</span>
          </div>

          <section class="panel member-directory" aria-labelledby="member-list-title">
            <div class="heading">
              <div>
                <h2 id="member-list-title">All team members</h2>
                <p>Everyone with access to the Luminate workspace.</p>
              </div>
              <span>Team</span>
              <span>Role</span>
            </div>

            <div class="member-list">
              <article class="member-row">
                <span class="avatar">AL</span>
                <div class="identity">
                  <a class="name">Member name</a>
                  <span class="email">name@luminate.example</span>
                </div>
                <span class="team">Team</span>
                <span class="role">Role</span>
              </article>
            </div>
          </section>

          <section class="team-actions">
            <div class="heading">
              <div>
                <h2>Team actions</h2>
                <p>Invitations and new teams require a connected server.</p>
              </div>
            </div>

            <div class="forms">
              <form class="panel team-form invite" novalidate>
                <div class="heading">
                  <span class="icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                      <circle cx="9" cy="8" r="3"></circle>
                      <path d="M3.5 19c.5-4 2.3-6 5.5-6s5 2 5.5 6M17.5 8v6M14.5 11h6"></path>
                    </svg>
                  </span>
                  <div>
                    <h2>Invite a teammate</h2>
                    <p>Send an invitation to join Luminate.</p>
                  </div>
                </div>

                <label class="field">
                  <span>Email address</span>
                  <input
                    type="email"
                    name="email"
                    placeholder="name@company.com"
                    aria-describedby="invite-email-error"
                    required
                  >
                  <small
                    class="error"
                    id="invite-email-error"
                    aria-live="polite"
                    hidden
                  ></small>
                </label>

                <label class="field">
                  <span>Role</span>
                  <select name="role">
                    <option>Member</option>
                    <option>Admin</option>
                    <option>Viewer</option>
                  </select>
                </label>

                <button class="primary-button" type="submit">Send invitation</button>
              </form>

              <form class="panel team-form" novalidate>
                <div class="heading">
                  <span class="icon orange" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                      <circle cx="8" cy="8" r="3"></circle>
                      <circle cx="17" cy="9" r="2.5"></circle>
                      <path d="M2.5 19c.5-4 2.3-6 5.5-6s5 2 5.5 6M14 14c3.8-.7 6.2 1 6.8 5"></path>
                    </svg>
                  </span>
                  <div>
                    <h2>Create a team</h2>
                    <p>Group teammates around a shared area of work.</p>
                  </div>
                </div>

                <label class="field">
                  <span>Team name</span>
                  <input
                    type="text"
                    name="teamName"
                    placeholder="e.g. Product design"
                    required
                  >
                </label>

                <label class="field">
                  <span>Description <em>Optional</em></span>
                  <textarea
                    name="description"
                    rows="3"
                    placeholder="What does this team work on?"
                  ></textarea>
                </label>

                <button class="primary-button" type="submit">Create team</button>
              </form>
            </div>
          </section>
        </div>

        <div id="profile" hidden>
          <a class="back-link" href="#/teams">
            <span aria-hidden="true">←</span>
            All team members
          </a>

          <article class="panel member-profile-card">
            <div class="header">
              <span class="avatar large">AL</span>
              <div>
                <p class="eyebrow team">Team</p>
                <h1 class="name">Member name</h1>
                <span class="role">Role</span>
              </div>
            </div>

            <p class="bio">Team member biography.</p>

            <dl class="member-details">
              <div>
                <dt>Email</dt>
                <dd><a class="email">name@luminate.example</a></dd>
              </div>
              <div>
                <dt>Country</dt>
                <dd class="country">Country</dd>
              </div>
              <div>
                <dt>Team</dt>
                <dd class="team">Team</dd>
              </div>
            </dl>
          </article>
        </div>

        <div
          id="toasts"
          aria-live="polite"
          aria-label="Notifications"
        >
          <div class="toast">
            <span class="icon" aria-hidden="true">!</span>
            <span class="message">No server for demo</span>
            <button type="button" aria-label="Dismiss notification">×</button>
          </div>
        </div>
      </section>
    </template>

    <script type="module">
      import {
        attr,
        define,
        emailValidationMessage,
        on,
        prop,
        repeat,
        style,
        text,
        update,
      } from './app.js'

      define('teams', () => {
        let nextToastId = 1
        const toastTimers = new Map()

        return {
          present: data => {
            const selectedMember = data.members.find(
              member => member.id === data.selectedMemberId,
            )

            return {
              toasts: data.toasts,
              memberCount: `${data.members.length} members`,
              members: data.members,
              hasSelectedMember: selectedMember !== undefined,
              selectedMember: selectedMember ?? data.members[0],
            }
          },
          template: document.querySelector('#teams-view'),
          bindings: [
              text('#directory > .heading .count', ({data}) => data.memberCount),
              repeat('.member-row', ({data}) => data.members, [
                text('.avatar', ({item}) => item.initials),
                text('.name', ({item}) => item.name),
                text('.email', ({item}) => item.email),
                text('.team', ({item}) => item.team),
                text('.role', ({item}) => item.role),
                attr('.name', 'href', ({item}) => `#/teams/${item.id}`),
                style('.avatar', 'background-color', ({item}) => item.tone),
              ]),
              text('#profile .avatar', ({data}) => data.selectedMember.initials),
              text('#profile .name', ({data}) => data.selectedMember.name),
              text('#profile .role', ({data}) => data.selectedMember.role),
              text('#profile .team', ({data}) => data.selectedMember.team),
              text('#profile .country', ({data}) => data.selectedMember.country),
              text('#profile .email', ({data}) => data.selectedMember.email),
              text('#profile .bio', ({data}) => data.selectedMember.bio),
              repeat('.toast', ({data}) => data.toasts, [
                text('.message', ({item}) => item.message),
                attr(':scope', 'data-toast-id', ({item}) => item.id),
              ]),
              on('.invite input[type="email"]', 'input', (e, el) => {
                if (
                  el instanceof HTMLInputElement
                  && el.hasAttribute('aria-invalid')
                ) {
                  showEmailError(el, emailValidationMessage(el))
                }
              }),
              on('.team-form', 'submit', (e, el) => {
                e.preventDefault()

                if (
                  el.matches('.invite')
                  && !validateInviteForm(el)
                ) {
                  return
                }

                const toast = {
                  id: `toast-${nextToastId++}`,
                  message: 'No server for demo',
                }

                update(data => ({...data, toasts: [...data.toasts, toast]}))

                const timer = window.setTimeout(() => {
                  toastTimers.delete(toast.id)
                  update(data => ({
                    ...data,
                    toasts: data.toasts.filter(item => item.id !== toast.id),
                  }))
                }, 3200)
                toastTimers.set(toast.id, timer)
              }),
              on('.toast', 'click', (e, el) => {
                const id = el.getAttribute('data-toast-id')

                if (id === null || id === undefined) {
                  return
                }

                window.clearTimeout(toastTimers.get(id))
                toastTimers.delete(id)
                update(data => ({
                  ...data,
                  toasts: data.toasts.filter(item => item.id !== id),
                }))
              }),
              prop('#directory', ({data}) => data.hasSelectedMember, 'hidden'),
              prop('#profile', ({data}) => !data.hasSelectedMember, 'hidden'),
              attr(
                '#profile .email',
                'href',
                ({data}) => `mailto:${data.selectedMember.email}`,
              ),
              style(
                '#profile .avatar',
                'background-color',
                ({data}) => data.selectedMember.tone,
              ),
          ],
        }

        /**
         * @param {Element} form
         * @returns {boolean}
         */
        function validateInviteForm(form) {
          const input = form.querySelector('input[type="email"]')

          if (!(input instanceof HTMLInputElement)) {
            throw new TypeError('Invite form requires an email input')
          }

          input.value = input.value.trim()
          const message = emailValidationMessage(input)
          showEmailError(input, message)

          if (message !== '') {
            input.focus()
            return false
          }

          return true
        }

        /**
         * @param {HTMLInputElement} input
         * @param {string} message
         */
        function showEmailError(input, message) {
          const error = input.form?.querySelector('.field .error')

          if (!(error instanceof HTMLElement)) {
            throw new TypeError('Invite form requires an email error message')
          }

          if (message === '') {
            input.removeAttribute('aria-invalid')
            error.hidden = true
            error.textContent = ''
            return
          }

          input.setAttribute('aria-invalid', 'true')
          error.textContent = message
          error.hidden = false
        }
      })
    </script>

    <template id="project-list">
      <div class="project-grid">
        <article class="project-card">
          <div class="top">
            <span class="accent"></span>
            <span class="status">Active</span>
          </div>
          <h3 class="name">Project name</h3>
          <p class="description">Project description</p>
          <div class="progress-label">
            <span>Progress</span>
            <strong class="value">0%</strong>
          </div>
          <div class="progress-track">
            <span class="bar"></span>
          </div>
          <div class="footer">
            <span class="members">AL · NB</span>
            <span class="due">Due soon</span>
          </div>
        </article>
      </div>
    </template>

    <script type="module">
      import {classToggle, define, repeat, style, text} from './app.js'

      define('projectList', {
        present: projects => ({projects}),
        template: document.querySelector('#project-list'),
        bindings: [
          repeat('.project-card', ({data}) => data.projects, [
            text('.status', ({item}) => item.status),
            text('.name', ({item}) => item.name),
            text('.description', ({item}) => item.description),
            text('.members', ({item}) => item.members),
            text('.due', ({item}) => item.due),
            text('.progress-label .value', ({item}) => `${item.progress}%`),
            style('.accent', 'background-color', ({item}) => item.accent),
            style('.progress-track .bar', 'width', ({item}) => `${item.progress}%`),
            classToggle('.status', 'planning', ({item}) => item.status === 'Planning'),
          ]),
        ],
      })
    </script>

    <template id="activity-list">
      <ol class="activity-list">
        <li class="activity-item">
          <span class="avatar">AL</span>
          <div class="copy">
            <p>
              <a class="person">Person</a>
              <span class="action">updated</span>
              <b class="target">an item</b>
            </p>
            <time>Just now</time>
          </div>
        </li>
      </ol>
    </template>

    <script type="module">
      import {attr, define, repeat, style, text} from './app.js'

      define('activityList', {
        present: activities => ({activities}),
        template: document.querySelector('#activity-list'),
        bindings: [
          repeat('.activity-item', ({data}) => data.activities, [
            text('.avatar', ({item}) => item.initials),
            text('.person', ({item}) => item.person),
            text('.action', ({item}) => item.action),
            text('.target', ({item}) => item.target),
            text('time', ({item}) => item.time),
            style('.avatar', 'background-color', ({item}) => item.tone),
            attr('.person', 'href', ({item}) => `#/teams/${item.personId}`),
          ]),
        ],
      })
    </script>

    <template id="overview-view">
      <section id="overview" aria-labelledby="overview-title">
        <div class="heading">
          <div>
            <p class="eyebrow"></p>
            <h1 id="overview-title">Welcome, Freddy</h1>
            <p>Here's what's happening across your workspace today.</p>
          </div>
          <a class="primary-button" href="#/projects">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7.5h6l2-2h8v14H4v-12Z"></path>
            </svg>
            View projects
          </a>
        </div>

        <div class="metric-grid">
          <article class="metric-card">
            <div class="top">
              <span class="label">Metric</span>
            </div>
            <strong class="value">0</strong>
            <span class="change">No change</span>
          </article>
        </div>

        <section class="focus">
          <div class="heading">
            <div>
              <h2>In focus</h2>
              <p>Your team's most active projects.</p>
            </div>
            <a class="text-link" href="#/projects">
              View all
              <span aria-hidden="true">→</span>
            </a>
          </div>
          <div class="content"></div>
        </section>

        <div class="overview-lower">
          <section class="panel activity-panel" aria-labelledby="recent-activity-title">
            <div class="heading">
              <div>
                <h2 id="recent-activity-title">Recent activity</h2>
                <p>The latest updates from your team.</p>
              </div>
              <a class="text-link" href="#/activity">See all</a>
            </div>
            <div class="content"></div>
          </section>

          <aside class="panel week-card" aria-labelledby="week-title">
            <div class="top">
              <p class="eyebrow">This week</p>
              <h2 id="week-title">Strong momentum</h2>
              <p>Your team completed 28% more work than last week.</p>
            </div>
            <div class="week-chart" aria-label="Weekly activity chart">
              <span data-day="Mon" style="height: 42%"><i>Mon</i></span>
              <span data-day="Tue" style="height: 67%"><i>Tue</i></span>
              <span data-day="Wed" style="height: 55%"><i>Wed</i></span>
              <span data-day="Thu" style="height: 88%"><i>Thu</i></span>
              <span data-day="Fri" style="height: 76%"><i>Fri</i></span>
              <span data-day="Sat" style="height: 24%"><i>Sat</i></span>
              <span data-day="Sun" style="height: 18%"><i>Sun</i></span>
            </div>
          </aside>
        </div>
      </section>
    </template>

    <script type="module">
      import {
        classToggle,
        define,
        repeat,
        text,
      } from './app.js'
      import {overviewDetails} from './data.js'

      const weekDays = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun']

      define('overview', {
        present: data => ({
          ...overviewDetails(data.now),
          metrics: data.metrics,
        }),
        template: document.querySelector('#overview-view'),
        bindings: [
          text('#overview > .heading .eyebrow', ({data}) => data.date),
          text('#overview-title', ({data}) => data.title),
          ...weekDays.map(day => classToggle(
            `.week-chart [data-day="${day}"]`,
            'today',
            ({data}) => data.today === day,
          )),
          repeat('.metric-card', ({data}) => data.metrics, [
            text('.label', ({item}) => item.label),
            text('.value', ({item}) => item.value),
            text('.change', ({item}) => item.change),
            classToggle(':scope', 'positive', ({item}) => item.direction === 'positive'),
          ]),
        ],
      })
    </script>

    <template id="projects-view">
      <section id="projects" aria-labelledby="projects-title">
        <div class="heading">
          <div>
            <p class="eyebrow">Workspace</p>
            <h1 id="projects-title">Projects</h1>
            <p>Plan work, track progress, and keep the team aligned.</p>
          </div>
        </div>

        <div class="project-toolbar">
          <div class="filters" aria-label="Filter projects">
            <button type="button" data-filter="all" aria-pressed="true">All</button>
            <button type="button" data-filter="active" aria-pressed="false">Active</button>
            <button type="button" data-filter="planning" aria-pressed="false">Planning</button>
          </div>
          <p class="summary">4 projects shown</p>
        </div>

        <div class="content"></div>
      </section>
    </template>

    <script type="module">
      import {
        attr,
        define,
        on,
        text,
        update,
      } from './app.js'

      define('projects', {
        present: data => {
          const projects = data.projects.filter(
            project => data.filter === 'all'
              || project.status.toLowerCase() === data.filter,
          )
          const suffix = projects.length === 1 ? 'project' : 'projects'

          return {
            filter: data.filter,
            summary: `${projects.length} ${suffix} shown`,
          }
        },
        template: document.querySelector('#projects-view'),
        bindings: [
          text('.project-toolbar .summary', ({data}) => data.summary),
          // Each button carries its filter, so both the handler and projection
          // read it from the native data attribute.
          on('[data-filter]', 'click', (e, el) => {
            const filter = el.dataset.filter

            if (
              filter === 'all'
              || filter === 'active'
              || filter === 'planning'
            ) {
              update(data => ({...data, filter}))
            }
          }),
          attr(
            '[data-filter]',
            'aria-pressed',
            ({data}, el) => String(el.dataset.filter === data.filter),
          ),
        ],
      })
    </script>

    <template id="records-view">
      <section id="records" aria-labelledby="records-title">
        <div class="heading">
          <div>
            <p class="eyebrow">Performance dataset</p>
            <h1 id="records-title">Records</h1>
            <p>Filter and sort a deterministic 20,000-row dataset without virtualization.</p>
          </div>
        </div>
        <div class="record-toolbar">
          <div class="filters" aria-label="Filter records">
            <button type="button" data-record-filter="all" aria-pressed="true">All</button>
            <button type="button" data-record-filter="alpha" aria-pressed="false">Alpha</button>
            <button type="button" data-record-filter="beta" aria-pressed="false">Beta</button>
            <button type="button" data-record-filter="gamma" aria-pressed="false">Gamma</button>
            <button type="button" data-record-filter="delta" aria-pressed="false">Delta</button>
          </div>
          <p class="record-summary">20,000 records shown</p>
        </div>
        <div class="record-list-wrap panel">
          <div class="record-list-header" data-record-header aria-sort="ascending">
            <button type="button" data-record-sort>
              Record <span class="record-sort-indicator" aria-hidden="true">↑</span>
            </button>
          </div>
          <ol class="record-list">
            <li class="record-row">record-00001 · alpha · Aida Loveleys · 97</li>
          </ol>
        </div>
      </section>
    </template>

    <script type="module">
      import {
        attr,
        define,
        filterLargeRecords,
        on,
        orderLargeRecords,
        repeat,
        text,
        update,
      } from './app.js'

      define('records', {
        present: data => {
          const records = orderLargeRecords(
            filterLargeRecords(data.recordFilter),
            data.recordSort,
          )
          return {
            filter: data.recordFilter,
            sort: data.recordSort,
            sortIndicator: data.recordSort === 'ascending' ? '↑' : '↓',
            rows: records.map(record => record.label),
            summary: `${records.length.toLocaleString('en-US')} records shown`,
          }
        },
        template: document.querySelector('#records-view'),
        bindings: [
          repeat('.record-row', ({data}) => data.rows, [
            text(':scope', ({item}) => item),
          ]),
          text('.record-summary', ({data}) => data.summary),
          text('.record-sort-indicator', ({data}) => data.sortIndicator),
          on('[data-record-sort]', 'click', () => {
            update(data => ({
              ...data,
              recordSort: data.recordSort === 'ascending'
                ? 'descending'
                : 'ascending',
            }))
          }),
          on('[data-record-filter]', 'click', (e, el) => {
            const recordFilter = el.dataset.recordFilter
            if (
              recordFilter === 'all'
              || recordFilter === 'alpha'
              || recordFilter === 'beta'
              || recordFilter === 'gamma'
              || recordFilter === 'delta'
            ) {
              update(data => ({...data, recordFilter}))
            }
          }),
          attr(
            '[data-record-filter]',
            'aria-pressed',
            ({data}, el) => String(el.dataset.recordFilter === data.filter),
          ),
          attr('[data-record-header]', 'aria-sort', ({data}) => data.sort),
        ],
      })
    </script>

    <template id="activity-page">
      <section id="activity" aria-labelledby="activity-title">
        <div class="heading">
          <div>
            <p class="eyebrow">Workspace</p>
            <h1 id="activity-title">Team activity</h1>
            <p>A shared record of progress across every project.</p>
          </div>
          <span class="count">5 updates</span>
        </div>

        <div class="activity-layout">
          <section class="panel activity-panel" aria-label="All activity">
            <div class="activity-date">
              <span>Today</span>
              <span class="line"></span>
            </div>
            <div class="content"></div>
          </section>

          <aside class="activity-summary">
            <section class="panel summary-card">
              <p class="eyebrow">Last 7 days</p>
              <strong>42</strong>
              <span>team updates</span>
              <div class="mini-bars" aria-hidden="true">
                <i style="height: 30%"></i>
                <i style="height: 55%"></i>
                <i style="height: 42%"></i>
                <i style="height: 75%"></i>
                <i style="height: 100%"></i>
                <i style="height: 62%"></i>
                <i style="height: 80%"></i>
              </div>
            </section>
            <section class="panel contributor-card">
              <p class="eyebrow">Top contributors</p>
              <div><span class="avatar purple">NB</span><a href="#/teams/norm-barlug">Norm Barlug</a><em>14</em></div>
              <div><span class="avatar green">EN</span><a href="#/teams/emmy-nother">Emmy Nother</a><em>11</em></div>
              <div><span class="avatar orange">FK</span><a href="#/teams/fazlo-kan">Fazlo Kan</a><em>9</em></div>
            </section>
          </aside>
        </div>
      </section>
    </template>

    <script type="module">
      import {define, text} from './app.js'

      define('activityPage', {
        present: data => ({
          count: `${data.activities.length} updates`,
        }),
        template: document.querySelector('#activity-page'),
        bindings: [
          text('#activity > .heading .count', ({data}) => data.count),
        ],
      })
    </script>
  </body>
</html>
