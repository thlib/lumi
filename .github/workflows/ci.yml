name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run lint

      - name: Run unit contracts
        run: npm test

      - name: Test the published package
        run: npm run test:package

      - name: Install portable browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run browser contracts
        run: npm run test:browser -- --project=chromium --project=firefox
