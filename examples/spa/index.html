<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#17152d">
    <meta
      name="description"
      content="A single-page application composed with Lumi."
    >
    <title>Overview · Luminate</title>
    <link rel="stylesheet" href="./spa.css">
    <script type="module" src="./spa.js"></script>
  </head>
  <body>
    <div id="app"></div>

    <template id="app-shell-template">
      <div class="app-shell">
        <div class="topbar-slot" data-header-slot></div>

        <aside class="sidebar">
          <div data-navigation-slot></div>
        </aside>

        <button
          class="nav-backdrop"
          type="button"
          data-action="close-nav"
          aria-label="Close navigation"
        ></button>

        <main class="main-content" id="main-content" tabindex="-1">
          <div data-page-slot></div>
        </main>
      </div>
    </template>

    <script type="module">
      import {child, classToggle, component, on} from '../../src/index.js'
      import {define} from './demo-components.js'
      import {update} from './page.js'

      define('appShell', ({resolve, present}) => {
        present(data => ({
          route: data.route,
          navOpen: data.navOpen,
        }))

        return component({
          template: document.querySelector('#app-shell-template'),
          bindings: [
            classToggle(
              '.app-shell',
              'nav-open',
              data => data.appShell.navOpen,
            ),
            on('[data-action="close-nav"]', 'click', () => {
              update(data => ({...data, navOpen: false}))
            }),
            child(
              '[data-header-slot]',
              resolve('header'),
              data => data.header,
            ),
            child(
              '[data-navigation-slot]',
              resolve('navigation'),
              data => data.navigation,
            ),
          ],
        })
      })
    </script>

    <template id="header-template">
      <header class="topbar">
        <div class="topbar__start">
          <button
            class="icon-button menu-button"
            type="button"
            data-menu-toggle
            aria-label="Open navigation"
            aria-controls="primary-navigation"
            aria-expanded="false"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h16M4 12h16M4 17h16"></path>
            </svg>
          </button>

          <a class="brand" href="#/overview" aria-label="Luminate overview">
            <svg class="brand__mark" viewBox="0 0 36 36" aria-hidden="true">
              <path d="M18 3l3.6 11.4L33 18l-11.4 3.6L18 33l-3.6-11.4L3 18l11.4-3.6L18 3Z"></path>
              <circle cx="18" cy="18" r="3.8"></circle>
            </svg>
            <span>luminate</span>
          </a>

          <span class="topbar__divider" aria-hidden="true"></span>
          <div class="workspace-switcher">
            <span class="workspace-avatar">N</span>
            <span data-bind="$.workspace">Luminate</span>
          </div>
        </div>

        <div class="topbar__end">
          <a class="user-menu" href="#/teams/freddy-fraggin">
            <span class="user-avatar" data-bind="$.userInitials">FF</span>
            <span class="user-name" data-bind="$.userName">Freddy Fraggin</span>
          </a>
        </div>
      </header>
    </template>

    <script type="module">
      import {attr, component, on} from '../../src/index.js'
      import {bindData, define} from './demo-components.js'
      import {update} from './page.js'

      define('header', ({present}) => {
        present(data => ({
          workspace: 'Luminate',
          userName: 'Freddy Fraggin',
          userInitials: 'FF',
          navOpen: data.navOpen,
        }))

        return component({
          template: document.querySelector('#header-template'),
          bindings: [
            bindData(),
            attr(
              '[data-menu-toggle]',
              'aria-expanded',
              data => String(data.navOpen),
            ),
            on('[data-menu-toggle]', 'click', () => {
              update(data => ({...data, navOpen: !data.navOpen}))
            }),
          ],
        })
      })
    </script>

    <template id="navigation-template">
      <nav class="navigation" id="primary-navigation" aria-label="Primary navigation">
        <div class="navigation__body">
          <p class="navigation__eyebrow">Workspace</p>
          <a class="nav-link" href="#/overview" data-route="overview">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="4" y="4" width="6" height="6" rx="1"></rect>
              <rect x="14" y="4" width="6" height="6" rx="1"></rect>
              <rect x="4" y="14" width="6" height="6" rx="1"></rect>
              <rect x="14" y="14" width="6" height="6" rx="1"></rect>
            </svg>
            <span>Overview</span>
          </a>
          <a class="nav-link" href="#/projects" data-route="projects">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7.5h6l2-2h8v14H4v-12Z"></path>
            </svg>
            <span>Projects</span>
            <span class="nav-link__count" data-bind="$.projectCount">4</span>
          </a>
          <a class="nav-link" href="#/activity" data-route="activity">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 12h3l2-6 4 12 2-6h5"></path>
            </svg>
            <span>Activity</span>
          </a>

          <p class="navigation__eyebrow navigation__eyebrow--spaced">Manage</p>
          <a class="nav-link" href="#/teams" data-route="teams">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="9" cy="8" r="3"></circle>
              <path d="M3.5 19c.5-4 2.3-6 5.5-6s5 2 5.5 6M16 8h5M18.5 5.5v5"></path>
            </svg>
            <span>Teams</span>
          </a>
        </div>

      </nav>
    </template>

    <script type="module">
      import {attr, component, on} from '../../src/index.js'
      import {bindData, define} from './demo-components.js'
      import {update} from './page.js'

      define('navigation', ({present}) => {
        present(data => ({
          route: data.route,
          projectCount: data.projects.length,
        }))

        return component({
          template: document.querySelector('#navigation-template'),
          bindings: [
            bindData(),
            on('[data-route]', 'click', (_event, element) => {
              if (element.dataset.route === window.location.hash.slice(2)) {
                update(data => ({...data, navOpen: false}))
              }
            }),
            attr(
              '[data-route="overview"]',
              'aria-current',
              data => data.route === 'overview' ? 'page' : false,
            ),
            attr(
              '[data-route="projects"]',
              'aria-current',
              data => data.route === 'projects' ? 'page' : false,
            ),
            attr(
              '[data-route="activity"]',
              'aria-current',
              data => data.route === 'activity' ? 'page' : false,
            ),
            attr(
              '[data-route="teams"]',
              'aria-current',
              data => data.route === 'teams' ? 'page' : false,
            ),
          ],
        })
      })
    </script>

    <template id="teams-template">
      <section class="page">
        <div data-team-directory>
          <div class="page-heading">
            <div>
              <p class="eyebrow">Manage</p>
              <h1 id="teams-title">Manage teams</h1>
              <p>Invite people and organize how your workspace collaborates.</p>
            </div>
            <span class="count-chip" data-bind="$.memberCount">11 members</span>
          </div>

          <section class="panel member-directory" aria-labelledby="member-list-title">
            <div class="member-directory__heading">
              <div>
                <h2 id="member-list-title">All team members</h2>
                <p>Everyone with access to the Luminate workspace.</p>
              </div>
              <span>Team</span>
              <span>Role</span>
            </div>

            <div class="member-list">
              <article class="member-row" data-bind="$.members">
                <span
                  class="member-avatar"
                  data-member-avatar
                  data-bind="$.members.initials"
                >AL</span>
                <div class="member-row__identity">
                  <a data-member-link data-bind="$.members.name">Member name</a>
                  <span data-bind="$.members.email">name@luminate.example</span>
                </div>
                <span class="member-row__team" data-bind="$.members.team">Team</span>
                <span class="member-row__role" data-bind="$.members.role">Role</span>
              </article>
            </div>
          </section>

          <div class="section-heading team-actions-heading">
            <div>
              <h2>Team actions</h2>
              <p>Invitations and new teams require a connected server.</p>
            </div>
          </div>

          <div class="team-form-grid">
            <form
              class="panel team-form"
              data-demo-form
              data-invite-form
              novalidate
            >
              <div class="team-form__heading">
                <span class="team-form__icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <circle cx="9" cy="8" r="3"></circle>
                    <path d="M3.5 19c.5-4 2.3-6 5.5-6s5 2 5.5 6M17.5 8v6M14.5 11h6"></path>
                  </svg>
                </span>
                <div>
                  <h2>Invite a teammate</h2>
                  <p>Send an invitation to join Luminate.</p>
                </div>
              </div>

              <label class="form-field">
                <span>Email address</span>
                <input
                  type="email"
                  name="email"
                  placeholder="name@company.com"
                  aria-describedby="invite-email-error"
                  data-invite-email
                  required
                >
                <small
                  class="form-field__error"
                  id="invite-email-error"
                  data-email-error
                  aria-live="polite"
                  hidden
                ></small>
              </label>

              <label class="form-field">
                <span>Role</span>
                <select name="role">
                  <option>Member</option>
                  <option>Admin</option>
                  <option>Viewer</option>
                </select>
              </label>

              <button class="primary-button" type="submit">Send invitation</button>
            </form>

            <form class="panel team-form" data-demo-form novalidate>
              <div class="team-form__heading">
                <span class="team-form__icon team-form__icon--orange" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <circle cx="8" cy="8" r="3"></circle>
                    <circle cx="17" cy="9" r="2.5"></circle>
                    <path d="M2.5 19c.5-4 2.3-6 5.5-6s5 2 5.5 6M14 14c3.8-.7 6.2 1 6.8 5"></path>
                  </svg>
                </span>
                <div>
                  <h2>Create a team</h2>
                  <p>Group teammates around a shared area of work.</p>
                </div>
              </div>

              <label class="form-field">
                <span>Team name</span>
                <input
                  type="text"
                  name="teamName"
                  placeholder="e.g. Product design"
                  required
                >
              </label>

              <label class="form-field">
                <span>Description <em>Optional</em></span>
                <textarea
                  name="description"
                  rows="3"
                  placeholder="What does this team work on?"
                ></textarea>
              </label>

              <button class="primary-button" type="submit">Create team</button>
            </form>
          </div>
        </div>

        <div class="member-profile" data-member-profile hidden>
          <a class="back-link" href="#/teams">
            <span aria-hidden="true">←</span>
            All team members
          </a>

          <article class="panel member-profile-card">
            <div class="member-profile-card__header">
              <span
                class="member-avatar member-avatar--large"
                data-profile-avatar
                data-bind="$.selectedMember.initials"
              >AL</span>
              <div>
                <p class="eyebrow" data-bind="$.selectedMember.team">Team</p>
                <h1 data-bind="$.selectedMember.name">Member name</h1>
                <span data-bind="$.selectedMember.role">Role</span>
              </div>
            </div>

            <p class="member-profile-card__bio" data-bind="$.selectedMember.bio">
              Team member biography.
            </p>

            <dl class="member-details">
              <div>
                <dt>Email</dt>
                <dd>
                  <a
                    data-member-email
                    data-bind="$.selectedMember.email"
                  >name@luminate.example</a>
                </dd>
              </div>
              <div>
                <dt>Country</dt>
                <dd data-bind="$.selectedMember.country">Country</dd>
              </div>
              <div>
                <dt>Team</dt>
                <dd data-bind="$.selectedMember.team">Team</dd>
              </div>
            </dl>
          </article>
        </div>

        <div
          class="demo-toast-region"
          aria-live="polite"
          aria-label="Notifications"
        >
          <div
            class="demo-toast"
            data-bind="$.toasts"
            data-demo-toast
          >
            <span class="demo-toast__icon" aria-hidden="true">!</span>
            <span data-bind="$.toasts.message">No server for demo</span>
            <button
              type="button"
              data-dismiss-toast
              aria-label="Dismiss notification"
            >×</button>
          </div>
        </div>
      </section>
    </template>

    <script type="module">
      import {attr, component, on, prop, style} from '../../src/index.js'
      import {bindData, define} from './demo-components.js'
      import {update} from './page.js'
      import {emailValidationMessage} from './validation.js'

      define('teams', ({present}) => {
        let nextToastId = 1
        const toastTimers = new Map()

        present(data => {
          const selectedMember = data.members.find(member => {
            return member.id === data.selectedMemberId
          })

          return {
            toasts: data.toasts,
            memberCount: `${data.members.length} members`,
            members: data.members,
            hasSelectedMember: selectedMember !== undefined,
            selectedMember: selectedMember ?? data.members[0],
          }
        })

        return component({
          template: document.querySelector('#teams-template'),
          bindings: [
            bindData(),
            on('[data-invite-email]', 'input', (_event, element) => {
              if (
                element instanceof HTMLInputElement
                && element.hasAttribute('aria-invalid')
              ) {
                showEmailError(element, emailValidationMessage(element))
              }
            }),
            on('[data-demo-form]', 'submit', (event, element) => {
              event.preventDefault()

              if (
                element.hasAttribute('data-invite-form')
                && !validateInviteForm(element)
              ) {
                return
              }

              const toast = {
                id: `demo-toast-${nextToastId++}`,
                message: 'No server for demo',
              }

              update(data => ({...data, toasts: [...data.toasts, toast]}))

              const timer = window.setTimeout(() => {
                toastTimers.delete(toast.id)
                update(data => ({
                  ...data,
                  toasts: data.toasts.filter(item => item.id !== toast.id),
                }))
              }, 3200)
              toastTimers.set(toast.id, timer)
            }),
            on('[data-demo-toast]', 'click', (_event, element) => {
              const id = element.getAttribute('data-toast-id')

              if (id === null || id === undefined) {
                return
              }

              window.clearTimeout(toastTimers.get(id))
              toastTimers.delete(id)
              update(data => ({
                ...data,
                toasts: data.toasts.filter(item => item.id !== id),
              }))
            }),
            prop(
              '[data-team-directory]',
              data => data.hasSelectedMember,
              'hidden',
            ),
            prop(
              '[data-member-profile]',
              data => !data.hasSelectedMember,
              'hidden',
            ),
            attr(
              '[data-demo-toast]',
              'data-toast-id',
              data => data.toasts.map(toast => toast.id),
            ),
            attr(
              '[data-member-link]',
              'href',
              data => data.members.map(member => `#/teams/${member.id}`),
            ),
            attr(
              '[data-member-email]',
              'href',
              data => `mailto:${data.selectedMember.email}`,
            ),
            style(
              '[data-member-avatar]',
              'background-color',
              data => data.members.map(member => member.tone),
            ),
            style(
              '[data-profile-avatar]',
              'background-color',
              data => data.selectedMember.tone,
            ),
          ],
        })

        /**
         * @param {Element} form
         * @returns {boolean}
         */
        function validateInviteForm(form) {
          const input = form.querySelector('[data-invite-email]')

          if (!(input instanceof HTMLInputElement)) {
            throw new TypeError('Invite form requires an email input')
          }

          input.value = input.value.trim()
          const message = emailValidationMessage(input)
          showEmailError(input, message)

          if (message !== '') {
            input.focus()
            return false
          }

          return true
        }

        /**
         * @param {HTMLInputElement} input
         * @param {string} message
         */
        function showEmailError(input, message) {
          const error = input.form?.querySelector('[data-email-error]')

          if (!(error instanceof HTMLElement)) {
            throw new TypeError('Invite form requires an email error message')
          }

          if (message === '') {
            input.removeAttribute('aria-invalid')
            error.hidden = true
            error.textContent = ''
            return
          }

          input.setAttribute('aria-invalid', 'true')
          error.textContent = message
          error.hidden = false
        }
      })
    </script>

    <template id="overview-template">
      <section class="page" aria-labelledby="overview-title">
        <div class="page-heading">
          <div>
            <p class="eyebrow" data-bind="$.date">Friday, July 24</p>
            <h1 id="overview-title" data-bind="$.title">Good morning, Freddy</h1>
            <p>Here's what's happening across your workspace today.</p>
          </div>
          <a class="primary-button" href="#/projects">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7.5h6l2-2h8v14H4v-12Z"></path>
            </svg>
            View projects
          </a>
        </div>

        <div class="metric-grid">
          <article class="metric-card" data-bind="$.metrics">
            <div class="metric-card__top">
              <span data-bind="$.metrics.label">Metric</span>
            </div>
            <strong data-bind="$.metrics.value">0</strong>
            <span
              class="metric-card__change"
              data-bind="$.metrics.change"
            >No change</span>
          </article>
        </div>

        <div class="section-heading">
          <div>
            <h2>In focus</h2>
            <p>Your team's most active projects.</p>
          </div>
          <a class="text-link" href="#/projects">
            View all
            <span aria-hidden="true">→</span>
          </a>
        </div>
        <div class="project-grid project-grid--overview">
          <article class="project-card" data-bind="$.projects">
            <div class="project-card__top">
              <span class="project-accent" data-project-accent></span>
              <span
                class="status"
                data-project-status
                data-bind="$.projects.status"
              >Active</span>
            </div>
            <h3 data-bind="$.projects.name">Project name</h3>
            <p data-bind="$.projects.description">Project description</p>
            <div class="progress-label">
              <span>Progress</span>
              <strong data-project-progress>0%</strong>
            </div>
            <div class="progress-track">
              <span data-project-progress-bar></span>
            </div>
            <div class="project-card__footer">
              <span
                class="member-stack"
                data-bind="$.projects.members"
              >AL · NB</span>
              <span data-bind="$.projects.due">Due soon</span>
            </div>
          </article>
        </div>

        <div class="overview-lower">
          <section class="panel activity-panel" aria-labelledby="recent-activity-title">
            <div class="panel__heading">
              <div>
                <h2 id="recent-activity-title">Recent activity</h2>
                <p>The latest updates from your team.</p>
              </div>
              <a class="text-link" href="#/activity">See all</a>
            </div>
            <ol class="activity-list activity-list--compact">
              <li class="activity-item" data-bind="$.activities">
                <span
                  class="activity-avatar"
                  data-activity-avatar
                  data-bind="$.activities.initials"
                >AL</span>
                <div class="activity-item__copy">
                  <p>
                    <a
                      class="person-link"
                      data-activity-person
                      data-bind="$.activities.person"
                    >Person</a>
                    <span data-bind="$.activities.action">updated</span>
                    <b data-bind="$.activities.target">an item</b>
                  </p>
                  <time data-bind="$.activities.time">Just now</time>
                </div>
              </li>
            </ol>
          </section>

          <aside class="panel week-card" aria-labelledby="week-title">
            <div class="week-card__top">
              <p class="eyebrow">This week</p>
              <h2 id="week-title">Strong momentum</h2>
              <p>Your team completed 28% more work than last week.</p>
            </div>
            <div class="week-chart" aria-label="Weekly activity chart">
              <span style="height: 42%"><i>Mon</i></span>
              <span style="height: 67%"><i>Tue</i></span>
              <span style="height: 55%"><i>Wed</i></span>
              <span style="height: 88%"><i>Thu</i></span>
              <span class="is-today" style="height: 76%"><i>Fri</i></span>
              <span style="height: 24%"><i>Sat</i></span>
              <span style="height: 18%"><i>Sun</i></span>
            </div>
          </aside>
        </div>
      </section>
    </template>

    <script type="module">
      import {
        attr,
        bind,
        classToggle,
        component,
        style,
      } from '../../src/index.js'
      import {bindData, define} from './demo-components.js'

      define('overview', ({present}) => {
        present(data => ({
          title: 'Good morning, Freddy',
          date: 'Friday, July 24',
          metrics: data.metrics,
          projects: data.projects.slice(0, 3),
          activities: data.activities.slice(0, 3),
        }))

        return component({
          template: document.querySelector('#overview-template'),
          bindings: [
            bindData(),
            classToggle(
              '.metric-card',
              'metric-card--positive',
              data => data.metrics.map(metric => {
                return metric.direction === 'positive'
              }),
            ),
            style(
              '[data-project-accent]',
              'background-color',
              data => data.projects.map(project => project.accent),
            ),
            style(
              '[data-project-progress-bar]',
              'width',
              data => data.projects.map(project => `${project.progress}%`),
            ),
            bind(
              '[data-project-progress]',
              data => data.projects.map(project => `${project.progress}%`),
            ),
            classToggle(
              '[data-project-status]',
              'status--planning',
              data => data.projects.map(project => {
                return project.status === 'Planning'
              }),
            ),
            style(
              '[data-activity-avatar]',
              'background-color',
              data => data.activities.map(activity => activity.tone),
            ),
            attr(
              '[data-activity-person]',
              'href',
              data => data.activities.map(activity => {
                return `#/teams/${activity.personId}`
              }),
            ),
          ],
        })
      })
    </script>

    <template id="projects-template">
      <section class="page" aria-labelledby="projects-title">
        <div class="page-heading">
          <div>
            <p class="eyebrow">Workspace</p>
            <h1 id="projects-title">Projects</h1>
            <p>Plan work, track progress, and keep the team aligned.</p>
          </div>
        </div>

        <div class="project-toolbar">
          <div class="filter-group" aria-label="Filter projects">
            <button type="button" data-filter="all" aria-pressed="true">All</button>
            <button type="button" data-filter="active" aria-pressed="false">Active</button>
            <button type="button" data-filter="planning" aria-pressed="false">Planning</button>
          </div>
          <p data-bind="$.summary">4 projects shown</p>
        </div>

        <div class="project-grid">
          <article class="project-card" data-bind="$.projects">
            <div class="project-card__top">
              <span class="project-accent" data-project-accent></span>
              <span
                class="status"
                data-project-status
                data-bind="$.projects.status"
              >Active</span>
            </div>
            <h3 data-bind="$.projects.name">Project name</h3>
            <p data-bind="$.projects.description">Project description</p>
            <div class="progress-label">
              <span>Progress</span>
              <strong data-project-progress>0%</strong>
            </div>
            <div class="progress-track">
              <span data-project-progress-bar></span>
            </div>
            <div class="project-card__footer">
              <span
                class="member-stack"
                data-bind="$.projects.members"
              >AL · NB</span>
              <span data-bind="$.projects.due">Due soon</span>
            </div>
          </article>
        </div>
      </section>
    </template>

    <script type="module">
      import {
        attr,
        bind,
        classToggle,
        component,
        on,
        style,
      } from '../../src/index.js'
      import {bindData, define} from './demo-components.js'
      import {update} from './page.js'

      define('projects', ({present}) => {
        present(data => {
          const projects = data.projects.filter(project => {
            return data.filter === 'all'
              || project.status.toLowerCase() === data.filter
          })
          const suffix = projects.length === 1 ? 'project' : 'projects'

          return {
            filter: data.filter,
            projects,
            summary: `${projects.length} ${suffix} shown`,
          }
        })

        return component({
          template: document.querySelector('#projects-template'),
          bindings: [
            bindData(),
            on('[data-filter]', 'click', (_event, element) => {
              const filter = element.dataset.filter

              if (
                filter === 'all'
                || filter === 'active'
                || filter === 'planning'
              ) {
                update(data => ({...data, filter}))
              }
            }),
            bind(
              '[data-project-progress]',
              data => data.projects.map(project => `${project.progress}%`),
            ),
            style(
              '[data-project-accent]',
              'background-color',
              data => data.projects.map(project => project.accent),
            ),
            style(
              '[data-project-progress-bar]',
              'width',
              data => data.projects.map(project => `${project.progress}%`),
            ),
            classToggle(
              '[data-project-status]',
              'status--planning',
              data => data.projects.map(project => {
                return project.status === 'Planning'
              }),
            ),
            attr(
              '[data-filter="all"]',
              'aria-pressed',
              data => String(data.filter === 'all'),
            ),
            attr(
              '[data-filter="active"]',
              'aria-pressed',
              data => String(data.filter === 'active'),
            ),
            attr(
              '[data-filter="planning"]',
              'aria-pressed',
              data => String(data.filter === 'planning'),
            ),
          ],
        })
      })
    </script>

    <template id="activity-page-template">
      <section class="page" aria-labelledby="activity-title">
        <div class="page-heading">
          <div>
            <p class="eyebrow">Workspace</p>
            <h1 id="activity-title">Team activity</h1>
            <p>A shared record of progress across every project.</p>
          </div>
          <span class="count-chip" data-bind="$.count">5 updates</span>
        </div>

        <div class="activity-layout">
          <section class="panel activity-panel activity-panel--page" aria-label="All activity">
            <div class="activity-date">
              <span>Today</span>
              <span class="activity-date__line"></span>
            </div>
            <ol class="activity-list">
              <li class="activity-item" data-bind="$.activities">
                <span
                  class="activity-avatar"
                  data-activity-avatar
                  data-bind="$.activities.initials"
                >AL</span>
                <div class="activity-item__copy">
                  <p>
                    <a
                      class="person-link"
                      data-activity-person
                      data-bind="$.activities.person"
                    >Person</a>
                    <span data-bind="$.activities.action">updated</span>
                    <b data-bind="$.activities.target">an item</b>
                  </p>
                  <time data-bind="$.activities.time">Just now</time>
                </div>
              </li>
            </ol>
          </section>

          <aside class="activity-summary">
            <section class="panel summary-card">
              <p class="eyebrow">Last 7 days</p>
              <strong>42</strong>
              <span>team updates</span>
              <div class="mini-bars" aria-hidden="true">
                <i style="height: 30%"></i>
                <i style="height: 55%"></i>
                <i style="height: 42%"></i>
                <i style="height: 75%"></i>
                <i style="height: 100%"></i>
                <i style="height: 62%"></i>
                <i style="height: 80%"></i>
              </div>
            </section>
            <section class="panel contributor-card">
              <p class="eyebrow">Top contributors</p>
              <div><span class="tiny-avatar tiny-avatar--purple">NB</span><a href="#/teams/norm-barlug">Norm Barlug</a><em>14</em></div>
              <div><span class="tiny-avatar tiny-avatar--green">EN</span><a href="#/teams/emmy-nother">Emmy Nother</a><em>11</em></div>
              <div><span class="tiny-avatar tiny-avatar--orange">FK</span><a href="#/teams/fazlo-kan">Fazlo Kan</a><em>9</em></div>
            </section>
          </aside>
        </div>
      </section>
    </template>

    <script type="module">
      import {attr, component, style} from '../../src/index.js'
      import {bindData, define} from './demo-components.js'

      define('activityPage', ({present}) => {
        present(data => ({
          count: `${data.activities.length} updates`,
          activities: data.activities,
        }))

        return component({
          template: document.querySelector('#activity-page-template'),
          bindings: [
            bindData(),
            style(
              '[data-activity-avatar]',
              'background-color',
              data => data.activities.map(activity => activity.tone),
            ),
            attr(
              '[data-activity-person]',
              'href',
              data => data.activities.map(activity => {
                return `#/teams/${activity.personId}`
              }),
            ),
          ],
        })
      })
    </script>
  </body>
</html>
