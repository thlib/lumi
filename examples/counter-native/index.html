<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lumi counter with native bindings</title>
    <script type="module">
      import {component, on, prop, repeat, text} from '../../src/index.js'

      let data = {
        count: 0,
        maximum: 5,
        items: [],
      }
      const slot = document.querySelector('#counter-slot')

      const counter = component({
        template: document.querySelector('#counter'),
        bindings: [
          text('output span', ({data}) => data.count),
          repeat('ul > li', ({data}) => data.items, [
            text(':scope', ({item}) => item.name),
          ]),
          prop('.increment', ({data}) => data.count >= data.maximum, 'disabled'),
          prop('.decrement', ({data}) => data.count <= 0, 'disabled'),
          on('.increment', 'click', () => {
            const count = data.count + 1
            data = {
              ...data,
              count,
              items: [...data.items, {name: `Item ${count}`}],
            }
            counter.update(data)
          }),
          on('.decrement', 'click', () => {
            const count = Math.max(0, data.count - 1)
            data = {
              ...data,
              count,
              items: data.items.slice(0, count),
            }
            counter.update(data)
          }),
        ],
      }).mount(slot)

      counter.update(data)
    </script>
  </head>
  <body>
    <main>
      <h1>Lumi counter with native bindings</h1>
      <div id="counter-slot"></div>
    </main>

    <template id="counter">
      <section class="counter">
        <output>count is <span>0</span></output>
        <button class="increment" type="button">Increment</button>
        <button class="decrement" type="button">Decrement</button>
        <ul>
          <li>Item</li>
        </ul>
      </section>
    </template>
  </body>
</html>
