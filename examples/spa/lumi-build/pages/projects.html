<template id="projects-view">
  <section id="projects" aria-labelledby="projects-title">
    <div class="heading">
      <div>
        <p class="eyebrow">Workspace</p>
        <h1 id="projects-title">Projects</h1>
        <p>Plan work, track progress, and keep the team aligned.</p>
      </div>
    </div>

    <div class="project-toolbar">
      <div class="filters" aria-label="Filter projects">
        <button type="button" data-filter="all" aria-pressed="true">All</button>
        <button type="button" data-filter="active" aria-pressed="false">Active</button>
        <button type="button" data-filter="planning" aria-pressed="false">Planning</button>
      </div>
      <p class="summary">4 projects shown</p>
    </div>

    <div class="content"></div>
  </section>
</template>

<script type="module">
  import {
    attr,
    on,
    text,
    update,
  } from '../app.js'

  export default {
    present: data => {
      const projects = data.projects.filter(
        project => data.filter === 'all'
          || project.status.toLowerCase() === data.filter,
      )
      const suffix = projects.length === 1 ? 'project' : 'projects'

      return {
        filter: data.filter,
        summary: `${projects.length} ${suffix} shown`,
      }
    },
    template: document.querySelector('#projects-view'),
    bindings: [
      text('.project-toolbar .summary', ({data}) => data.summary),
      // Each button carries its filter, so both the handler and projection
      // read it from the native data attribute.
      on('[data-filter]', 'click', (e, el) => {
        const filter = el.dataset.filter

        if (
          filter === 'all'
          || filter === 'active'
          || filter === 'planning'
        ) {
          update(data => ({...data, filter}))
        }
      }),
      attr(
        '[data-filter]',
        'aria-pressed',
        ({data}, el) => String(el.dataset.filter === data.filter),
      ),
    ],
  }
</script>
