<template id="teams-view">
  <section id="teams">
    <div id="directory">
      <div class="heading">
        <div>
          <p class="eyebrow">Manage</p>
          <h1 id="teams-title">Manage teams</h1>
          <p>Invite people and organize how your workspace collaborates.</p>
        </div>
        <span class="count">11 members</span>
      </div>

      <section class="panel member-directory" aria-labelledby="member-list-title">
        <div class="heading">
          <div>
            <h2 id="member-list-title">All team members</h2>
            <p>Everyone with access to the Luminate workspace.</p>
          </div>
          <span>Team</span>
          <span>Role</span>
        </div>

        <div class="member-list">
          <article class="member-row">
            <span class="avatar">AL</span>
            <div class="identity">
              <a class="name">Member name</a>
              <span class="email">name@luminate.example</span>
            </div>
            <span class="team">Team</span>
            <span class="role">Role</span>
          </article>
        </div>
      </section>

      <section class="team-actions">
        <div class="heading">
          <div>
            <h2>Team actions</h2>
            <p>Invitations and new teams require a connected server.</p>
          </div>
        </div>

        <div class="forms">
          <form class="panel team-form invite" novalidate>
            <div class="heading">
              <span class="icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <circle cx="9" cy="8" r="3"></circle>
                  <path d="M3.5 19c.5-4 2.3-6 5.5-6s5 2 5.5 6M17.5 8v6M14.5 11h6"></path>
                </svg>
              </span>
              <div>
                <h2>Invite a teammate</h2>
                <p>Send an invitation to join Luminate.</p>
              </div>
            </div>

            <label class="field">
              <span>Email address</span>
              <input
                type="email"
                name="email"
                placeholder="name@company.com"
                aria-describedby="invite-email-error"
                required
              >
              <small
                class="error"
                id="invite-email-error"
                aria-live="polite"
                hidden
              ></small>
            </label>

            <label class="field">
              <span>Role</span>
              <select name="role">
                <option>Member</option>
                <option>Admin</option>
                <option>Viewer</option>
              </select>
            </label>

            <button class="primary-button" type="submit">Send invitation</button>
          </form>

          <form class="panel team-form" novalidate>
            <div class="heading">
              <span class="icon" data-form-kind="create-team" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <circle cx="8" cy="8" r="3"></circle>
                  <circle cx="17" cy="9" r="2.5"></circle>
                  <path d="M2.5 19c.5-4 2.3-6 5.5-6s5 2 5.5 6M14 14c3.8-.7 6.2 1 6.8 5"></path>
                </svg>
              </span>
              <div>
                <h2>Create a team</h2>
                <p>Group teammates around a shared area of work.</p>
              </div>
            </div>

            <label class="field">
              <span>Team name</span>
              <input
                type="text"
                name="teamName"
                placeholder="e.g. Product design"
                required
              >
            </label>

            <label class="field">
              <span>Description <em>Optional</em></span>
              <textarea
                name="description"
                rows="3"
                placeholder="What does this team work on?"
              ></textarea>
            </label>

            <button class="primary-button" type="submit">Create team</button>
          </form>
        </div>
      </section>
    </div>

    <div id="profile" hidden>
      <a class="back-link" href="#/teams">
        <span aria-hidden="true">←</span>
        All team members
      </a>

      <article class="panel member-profile-card">
        <div class="header">
          <span class="avatar large">AL</span>
          <div>
            <p class="eyebrow team">Team</p>
            <h1 class="name">Member name</h1>
            <span class="role">Role</span>
          </div>
        </div>

        <p class="bio">Team member biography.</p>

        <dl class="member-details">
          <div>
            <dt>Email</dt>
            <dd><a class="email">name@luminate.example</a></dd>
          </div>
          <div>
            <dt>Country</dt>
            <dd class="country">Country</dd>
          </div>
          <div>
            <dt>Team</dt>
            <dd class="team">Team</dd>
          </div>
        </dl>
      </article>
    </div>

    <div
      id="toasts"
      aria-live="polite"
      aria-label="Notifications"
    >
      <div class="toast">
        <span class="icon" aria-hidden="true">!</span>
        <span class="message">No server for demo</span>
        <button type="button" aria-label="Dismiss notification">×</button>
      </div>
    </div>
  </section>
</template>

<script type="module">
  import {
    attr,
    emailValidationMessage,
    on,
    prop,
    repeat,
    text,
    update,
  } from '../app.js'

  export default () => {
    let nextToastId = 1
    const toastTimers = new Map()

    return {
      template: document.querySelector('#teams-view'),
      present: data => {
        const selectedMember = data.members.find(
          member => member.id === data.selectedMemberId,
        )

        return {
          toasts: data.toasts,
          memberCount: `${data.members.length} members`,
          members: data.members,
          hasSelectedMember: selectedMember !== undefined,
          selectedMember: selectedMember ?? data.members[0],
        }
      },
      bindings: [
          text('#directory > .heading .count', ({data}) => data.memberCount),
          repeat('.member-row', ({data}) => data.members, [
            text('.avatar', ({item}) => item.initials),
            text('.name', ({item}) => item.name),
            text('.email', ({item}) => item.email),
            text('.team', ({item}) => item.team),
            text('.role', ({item}) => item.role),
            attr('.name', 'href', ({item}) => `#/teams/${item.id}`),
            attr('.avatar', 'data-person', ({item}) => item.id),
          ]),
          text('#profile .avatar', ({data}) => data.selectedMember.initials),
          text('#profile .name', ({data}) => data.selectedMember.name),
          text('#profile .role', ({data}) => data.selectedMember.role),
          text('#profile .team', ({data}) => data.selectedMember.team),
          text('#profile .country', ({data}) => data.selectedMember.country),
          text('#profile .email', ({data}) => data.selectedMember.email),
          text('#profile .bio', ({data}) => data.selectedMember.bio),
          repeat('.toast', ({data}) => data.toasts, [
            text('.message', ({item}) => item.message),
            attr(':scope', 'data-toast-id', ({item}) => item.id),
          ]),
          on('.invite input[type="email"]', 'input', (e, el) => {
            if (
              el instanceof HTMLInputElement
              && el.hasAttribute('aria-invalid')
            ) {
              showEmailError(el, emailValidationMessage(el))
            }
          }),
          on('.team-form', 'submit', (e, el) => {
            e.preventDefault()

            if (
              el.matches('.invite')
              && !validateInviteForm(el)
            ) {
              return
            }

            const toast = {
              id: `toast-${nextToastId++}`,
              message: 'No server for demo',
            }

            update(data => ({...data, toasts: [...data.toasts, toast]}))

            const timer = window.setTimeout(() => {
              toastTimers.delete(toast.id)
              update(data => ({
                ...data,
                toasts: data.toasts.filter(item => item.id !== toast.id),
              }))
            }, 3200)
            toastTimers.set(toast.id, timer)
          }),
          on('.toast', 'click', (e, el) => {
            const id = el.getAttribute('data-toast-id')

            if (id === null || id === undefined) {
              return
            }

            window.clearTimeout(toastTimers.get(id))
            toastTimers.delete(id)
            update(data => ({
              ...data,
              toasts: data.toasts.filter(item => item.id !== id),
            }))
          }),
          prop('#directory', ({data}) => data.hasSelectedMember, 'hidden'),
          prop('#profile', ({data}) => !data.hasSelectedMember, 'hidden'),
          attr(
            '#profile .email',
            'href',
            ({data}) => `mailto:${data.selectedMember.email}`,
          ),
          attr(
            '#profile .avatar',
            'data-person',
            ({data}) => data.selectedMember.id,
          ),
      ],
    }

    /**
     * @param {Element} form
     * @returns {boolean}
     */
    function validateInviteForm(form) {
      const input = form.querySelector('input[type="email"]')

      if (!(input instanceof HTMLInputElement)) {
        throw new TypeError('Invite form requires an email input')
      }

      input.value = input.value.trim()
      const message = emailValidationMessage(input)
      showEmailError(input, message)

      if (message !== '') {
        input.focus()
        return false
      }

      return true
    }

    /**
     * @param {HTMLInputElement} input
     * @param {string} message
     */
    function showEmailError(input, message) {
      const error = input.form?.querySelector('.field .error')

      if (!(error instanceof HTMLElement)) {
        throw new TypeError('Invite form requires an email error message')
      }

      if (message === '') {
        input.removeAttribute('aria-invalid')
        error.hidden = true
        error.textContent = ''
        return
      }

      input.setAttribute('aria-invalid', 'true')
      error.textContent = message
      error.hidden = false
    }
  }
</script>
