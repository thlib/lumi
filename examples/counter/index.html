<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lumi counter with JSONPath</title>
    <script type="module">
      import {component, on, prop, repeat, text} from '../../src/index.js'
      import {jsonPath} from '../data-path.js'

      let data = {
        count: 0,
        maximum: 5,
        items: [],
      }
      const slot = document.querySelector('#counter-slot')

      const counter = component({
        template: document.querySelector('#counter'),
        bindings: [
          repeat(
            '[data-repeat]',
            ({item}, el) => jsonPath(item, el.dataset.repeat),
          ),
          text(
            '[data-text]',
            ({item}, el) => jsonPath(item, el.dataset.text)[0],
          ),
          prop(
            '[data-increment]',
            ({data}) => data.count >= data.maximum,
            'disabled',
          ),
          prop(
            '[data-decrement]',
            ({data}) => data.count <= 0,
            'disabled',
          ),
          on('[data-increment]', 'click', () => {
            const count = data.count + 1
            data = {
              ...data,
              count,
              items: [...data.items, {name: `Item ${count}`}],
            }
            counter.update(data)
          }),
          on('[data-decrement]', 'click', () => {
            const count = Math.max(0, data.count - 1)
            data = {
              ...data,
              count,
              items: data.items.slice(0, count),
            }
            counter.update(data)
          }),
        ],
      }).mount(slot)

      counter.update(data)
    </script>
  </head>
  <body>
    <main>
      <h1>Lumi counter with JSONPath</h1>
      <div id="counter-slot"></div>
    </main>

    <template id="counter">
      <section class="counter">
        <output>count is <span data-text="$.count">0</span></output>
        <button data-increment type="button">Increment</button>
        <button data-decrement type="button">Decrement</button>
        <ul>
          <li data-repeat="$.items[*]">
            <span data-text="$.name">Item</span>
          </li>
        </ul>
      </section>
    </template>
  </body>
</html>
