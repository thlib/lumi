<template id="projects-view">
  <section id="projects" aria-labelledby="projects-title" data-hidden="$.data.pages.projects">
    <div class="heading">
      <div>
        <p class="eyebrow">Workspace</p>
        <h1 id="projects-title">Projects</h1>
        <p>Plan work, track progress, and keep the team aligned.</p>
      </div>
    </div>

    <div class="project-toolbar">
      <div class="filters" aria-label="Filter projects">
        <button type="button" data-attr="aria-pressed: $.data.projectFilters.all" data-project-filter="all" aria-pressed="true">All</button>
        <button type="button" data-attr="aria-pressed: $.data.projectFilters.active" data-project-filter="active" aria-pressed="false">Active</button>
        <button type="button" data-attr="aria-pressed: $.data.projectFilters.planning" data-project-filter="planning" aria-pressed="false">Planning</button>
      </div>
      <p class="summary" data-path="$.data.projectSummary">4 projects shown</p>
    </div>

    <div class="content">
      <template data-include="project-list" data-repeat="$.data.projectPageScopes[*]"></template>
    </div>
  </section>
</template>
