<template id="activity-page">
  <section id="activity" aria-labelledby="activity-title" data-hidden="$.data.pages.activity">
    <div class="heading">
      <div>
        <p class="eyebrow">Workspace</p>
        <h1 id="activity-title">Team activity</h1>
        <p>A shared record of progress across every project.</p>
      </div>
      <span class="count" data-path="$.data.activityCount">5 updates</span>
    </div>

    <div class="activity-layout">
      <section class="panel activity-panel" aria-label="All activity">
        <div class="activity-date">
          <span>Today</span>
          <span class="line"></span>
        </div>
        <div class="content">
          <template data-include="activity-list" data-repeat="$.data.activityPageScopes[*]"></template>
        </div>
      </section>

      <aside class="activity-summary">
        <section class="panel summary-card">
          <p class="eyebrow">Last 7 days</p>
          <strong>42</strong>
          <span>team updates</span>
          <div class="mini-bars" aria-hidden="true">
            <i></i>
            <i></i>
            <i></i>
            <i></i>
            <i></i>
            <i></i>
            <i></i>
          </div>
        </section>
        <section class="panel contributor-card">
          <p class="eyebrow">Top contributors</p>
          <div><span class="avatar" data-person="norm-barlug">NB</span><a href="#/teams/norm-barlug">Norm Barlug</a><em>14</em></div>
          <div><span class="avatar" data-person="emmy-nother">EN</span><a href="#/teams/emmy-nother">Emmy Nother</a><em>11</em></div>
          <div><span class="avatar" data-person="fazlo-kan">FK</span><a href="#/teams/fazlo-kan">Fazlo Kan</a><em>9</em></div>
        </section>
      </aside>
    </div>
  </section>
</template>
